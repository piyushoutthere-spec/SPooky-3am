<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>The haunted web</title>

        <!--Horror fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com"> 
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
        <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="spooky.css">
    </head>
    <body>

        <!--Intro video-->
        <section id="introscene" class="scene">
            <video id="introvid" autoplay muted playsinline>
                <source src="assets/Screen Recording 2026-10-24 221836.mp4" type="video/mp4">
            </video>
        </section>

        <!--Main content of web-->
        <main id="maincontent" hidden>
            <!--six gifs-->
            <div id="giff" aria-hidden="true">
                <img class="giflefttop" src="assets/Happy Holidays.gif" alt="">
                <img class="gifleftbottom" src="assets/Happy Holidays.gif" alt="">
                <img class="gifleftmiddle" src="assets/Happy Holidays.gif" alt="">

                <img class="gifrighttop" src="assets/Happy Holidays.gif" alt="">
                <img class="gifrightmiddle" src="assets/Happy Holidays.gif" alt="">
                <img class="gifrightbottom" src="assets/Happy Holidays.gif" alt="">
            </div>


            

            <!--6 ghost displayed to choose one-->
            <section id="ghost-select">
                <h1>choose ur ghost</h1>
                <p>smtg w8ing for you..</p>
                <div class="ghost">
                    <img src="assets/GH1.png" alt="G1">
                </div>

                <div class="ghost">
                    <img src="assets/GH2.png" alt="G2">
                </div>

                <div class="ghost">
                    <img src="assets/GH3.png" alt="G3">
                </div>

                <div class="ghost">
                    <img src="assets/GH4.png" alt="G4">
                </div>

                <div class="ghost">
                    <img src="assets/GH5.png" alt="G5">
                </div>

                <div class="ghost">
                    <img src="assets/GH6.png" alt="G6">
                </div>
            </section>

            <!--it is hidden till the user chooses ghost-->
            <section id="msg-screen" hidden>
                <h1 id="GH-title">You choose...</h1>
                <p id="GH-msg"></p>
            </section>
            
            <!--Final msg screen-->
            <section id="finalmsg" hidden>
                <div id="finaltext">
                <p>You thought this was just a game.</p>
                <p>But some things do not stay behind the screen</p>
                <p>Thank you for visiting</p>
                <p>see you at 3am lad</p>
                </div>
            </section>
        </main>
        <audio id="creepy" src="assets/Assets_Audio_creepy.mp3" preload="auto"></audio>
        <script src="spooky.js"></script>
    </body>
</html>
